<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Management</title>
    <meta name="description" content="A comprehensive project management tool with epics, tasks, and project member management." />
    <meta property="og:title" content="Task Management" />
    <meta property="og:description" content="A comprehensive project management tool with epics, tasks, and project member management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        // Global handler to silence "User aborted a request" errors which are benign
        // and usually occur during component unmounts or preview refreshes.
        const ABORT_PATTERNS = [
          'aborted',
          'signal is aborted',
          'user aborted a request',
          'the user aborted a request',
          'cancelled',
          'aborterror',
          'operation was aborted',
          'signal is aborted without reason',
          'request was aborted',
          'fetch aborted',
          'network request failed',
          'failed to fetch',
          'cannot set property fetch'
        ];

        function isAbortSignal(arg) {
          if (!arg) return false;
          const str = String(arg).toLowerCase();
          let msg = '';
          let name = '';
          let code = '';
          let stack = '';

          if (arg instanceof Error || (typeof arg === 'object' && arg !== null)) {
            msg = arg.message ? String(arg.message).toLowerCase() : '';
            name = arg.name ? String(arg.name).toLowerCase() : '';
            code = arg.code ? String(arg.code).toLowerCase() : '';
            stack = arg.stack ? String(arg.stack).toLowerCase() : '';
          }

          return ABORT_PATTERNS.some(p => str.includes(p) || msg.includes(p) || name.includes(p) || stack.includes(p)) ||
                 code === 'cancelled' ||
                 code === '20';
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isAbortSignal(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.onerror = function(message, source, lineno, colno, error) {
          if (isAbortSignal(message) || isAbortSignal(error)) {
            return true;
          }
        };

        window.addEventListener('error', function(event) {
          if (isAbortSignal(event.message) || isAbortSignal(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Explicitly override console.error to filter out benign abort messages
        const originalConsoleError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && args.some(isAbortSignal)) {
            return;
          }
          originalConsoleError.apply(console, args);
        };

        // Also patch console.warn for extra safety
        const originalConsoleWarn = console.warn;
        console.warn = function(...args) {
          if (args.length === 0) return;
          const isAbort = args.some(isAbortSignal);
          if (isAbort) return;
          originalConsoleWarn.apply(console, args);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
